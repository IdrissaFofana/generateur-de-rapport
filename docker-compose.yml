# Déploiement segmenté (axe R1 du mémoire).
#
#   Internet / LAN ──443──► [proxy Nginx] ──8010──► [app] ──5432──► [db PostgreSQL]
#                              réseau « frontal »          réseau « donnees » (interne, sans sortie)
#                                                  [app] ──11434─► [llm Ollama]      (profil « ia »)
#                                                          réseau « ia » (interne, sans sortie)
#   [prometheus] ──► [app]/metrics  réseau « supervision » (interne)                    (profil « supervision »)
#   [taches] : planificateur (alertes, ancre du journal, résumé hebdomadaire), réseau « donnees » + sortie SMTP.
#
# Seul le proxy publie des ports. La base et le modèle de langage sont sur des réseaux « internal » :
# aucun accès depuis l'extérieur, et aucune connexion sortante possible depuis eux.
#
# Démarrage :  docker compose --env-file deploiement/.env up -d            (voir deploiement/LISEZMOI.md)
#              docker compose --env-file deploiement/.env --profile ia up -d  (avec le modèle de langage local)

x-durcissement: &durcissement
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app: &app
  <<: *durcissement
  image: rapports-esay:${VERSION:-local}
  build: .
  env_file: deploiement/.env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-rapports}:${POSTGRES_PASSWORD:?mot de passe PostgreSQL requis}@db:5432/${POSTGRES_DB:-rapports_esay}
    FORWARDED_ALLOW_IPS: 172.30.10.10
    OLLAMA_URL: http://llm:11434
  tmpfs: ["/tmp:size=256m,mode=1777"]
  volumes:
    - donnees:/donnees
  depends_on:
    db: { condition: service_healthy }

services:
  proxy:
    <<: *durcissement
    image: nginx:1.27-alpine
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]   # minimum pour lier 80/443 et abandonner root
    ports: ["443:443", "80:80"]
    tmpfs: ["/var/cache/nginx:size=64m", "/var/run:size=1m", "/tmp:size=16m"]
    volumes:
      - ./deploiement/nginx/rapports.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploiement/nginx/securite.conf:/etc/nginx/snippets/securite.conf:ro
      - ./deploiement/nginx/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
      - ${CERTIFICATS:-./deploiement/certificats}:/etc/nginx/certificats:ro
    networks:
      frontal: { ipv4_address: 172.30.10.10 }
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/connexion"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    <<: *app
    networks: [frontal, donnees, ia, supervision]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  taches:
    <<: *app
    command: ["python", "gerer.py", "planificateur"]
    healthcheck: { disable: true }
    networks: [donnees, sortie]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  db:
    <<: *durcissement
    image: postgres:16-alpine
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]  # nécessaires à l'initialisation de PostgreSQL
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rapports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe PostgreSQL requis}
      POSTGRES_DB: ${POSTGRES_DB:-rapports_esay}
      TZ: ${TZ:-Africa/Abidjan}
      PGTZ: ${TZ:-Africa/Abidjan}
    tmpfs: ["/var/run/postgresql:size=1m", "/tmp:size=64m"]
    volumes:
      - base:/var/lib/postgresql/data
    networks: [donnees]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rapports} -d ${POSTGRES_DB:-rapports_esay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1g }

  llm:
    # Modèle de langage local (axe 1 du mémoire) : aucun accès réseau sortant. Les modèles sont chargés une fois,
    # hors ligne, dans le volume « modeles » (voir deploiement/LISEZMOI.md).
    profiles: ["ia"]
    image: ollama/ollama:0.5.7
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    volumes:
      - modeles:/root/.ollama
    networks: [ia]
    deploy:
      resources:
        limits: { memory: 12g }

  prometheus:
    # Supervision (axe R3, profil « supervision ») : interface accessible uniquement depuis le serveur lui-même
    # (tunnel SSH : ssh -L 9090:127.0.0.1:9090 serveur).
    profiles: ["supervision"]
    image: prom/prometheus:v2.55.1
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=90d",
              "--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploiement/supervision/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploiement/supervision/regles.yml:/etc/prometheus/regles.yml:ro
      - ./deploiement/supervision/jeton_metriques:/etc/prometheus/jeton_metriques:ro
      - metriques:/prometheus
    networks: [supervision, console]   # « console » : seulement pour publier 127.0.0.1:9090

networks:
  console:
    ipam:
      config: [{ subnet: 172.30.60.0/24 }]
  supervision:
    internal: true
    ipam:
      config: [{ subnet: 172.30.50.0/24 }]
  frontal:
    ipam:
      config: [{ subnet: 172.30.10.0/24 }]
  donnees:
    internal: true
    ipam:
      config: [{ subnet: 172.30.20.0/24 }]
  ia:
    internal: true
    ipam:
      config: [{ subnet: 172.30.30.0/24 }]
  sortie:
    # seule sortie de l'arrière-plan : envoi des notifications (SMTP, Teams) et syslog
    ipam:
      config: [{ subnet: 172.30.40.0/24 }]

volumes:
  donnees:
  base:
  modeles:
  metriques:
