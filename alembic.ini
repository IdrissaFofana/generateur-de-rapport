# Migrations de la base (Alembic). L'URL de connexion vient du fichier .env (voir migrations/env.py).
#   Nouvelle migration après modification de app/modeles.py :
#       alembic revision --autogenerate -m "description"
#   Appliquer (fait aussi automatiquement au démarrage de l'application) :
#       alembic upgrade head
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
