# Collecte des métriques de la plateforme (axe R3). Prometheus est sur le réseau interne « supervision » :
# la route /metrics n'est jamais exposée par le proxy.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/regles.yml

scrape_configs:
  - job_name: rapports-esay
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/jeton_metriques   # même valeur que METRIQUES_JETON
    static_configs:
      - targets: ["app:8010"]
