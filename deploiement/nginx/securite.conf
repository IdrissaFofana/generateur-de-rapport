# En-têtes de sécurité (inclus dans chaque bloc qui ajoute ses propres en-têtes : add_header n'hérite pas).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP : ressources uniquement depuis la plateforme. 'unsafe-inline' reste nécessaire pour les scripts et styles
# écrits dans les gabarits (limite connue, à supprimer en externalisant ces scripts : voir le mémoire, axe S6).
# frame-ancestors 'self' : les aperçus PDF sont affichés dans une iframe de la plateforme elle-même.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
