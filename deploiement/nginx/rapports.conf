# Proxy frontal de la plateforme (axe R1) : seul point d'entrée, TLS, en-têtes de sécurité, limitation de débit.

# Limitation de débit par adresse IP : connexion (force brute) et reste de l'application
limit_req_zone $binary_remote_addr zone=connexion:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_status 429;

server_tokens off;

# HTTP : redirection permanente vers HTTPS, rien d'autre
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certificats/rapports.crt;
    ssl_certificate_key /etc/nginx/certificats/rapports.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/securite.conf;

    client_max_body_size 60M;          # dépôt de gros exports KSC et rapports importés
    client_body_timeout 60s;
    proxy_read_timeout 300s;           # génération de PDF volumineux

    location = /connexion {
        limit_req zone=connexion burst=5 nodelay;
        proxy_pass http://app:8010;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /connexion/code {
        limit_req zone=connexion burst=5 nodelay;
        proxy_pass http://app:8010;
        include /etc/nginx/snippets/proxy.conf;
    }
    # Les métriques ne sont jamais exposées à l'extérieur : Prometheus les lit sur le réseau interne
    location = /metrics {
        return 404;
    }
    location /static/ {
        proxy_pass http://app:8010;
        include /etc/nginx/snippets/proxy.conf;
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/securite.conf;
    }
    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://app:8010;
        include /etc/nginx/snippets/proxy.conf;
    }
}
