# /etc/ssh/sshd_config.d/10-durcissement.conf (axe R4) — accès d'administration par clé uniquement.
# AVANT d'appliquer : vérifier qu'une clé fonctionne pour au moins un compte administrateur (sinon perte d'accès).
# Contrôle : sudo sshd -t && sudo systemctl reload ssh
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
# Autoriser la redirection locale uniquement (tunnel vers Prometheus 127.0.0.1:9090)
AllowTcpForwarding local
# Restreindre aux administrateurs de la plateforme (groupe à créer : sudo groupadd admins-rapports)
AllowGroups admins-rapports
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
LogLevel VERBOSE
