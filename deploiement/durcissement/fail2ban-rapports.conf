# fail2ban (axe R4) : bannissement réseau des adresses qui échouent à se connecter à la plateforme.
# Complète la protection applicative (verrouillage du compte, limitation par IP) : le blocage se fait au pare-feu,
# avant même que les requêtes n'atteignent l'application.
#
# 1) /etc/fail2ban/filter.d/rapports-esay.conf  → section [Definition] ci-dessous
# 2) /etc/fail2ban/jail.d/rapports-esay.local   → section [rapports-esay] ci-dessous
#
# Les événements viennent de l'application (journal « rapports.securite ») :
#   evenement=echec_connexion ip=203.0.113.7 compte="x@y" detail="mot de passe"
# Déploiement Docker : journald reçoit les journaux des conteneurs si le pilote de journalisation « journald » est
# utilisé (option « logging: driver: journald » sur le service app) ; sinon lire le fichier du collecteur syslog.

[Definition]
failregex = ^.*rapports\.securite evenement=(echec_connexion|ip_bloquee|compte_verrouille) ip=<HOST> .*$
ignoreregex =

# --- /etc/fail2ban/jail.d/rapports-esay.local
[rapports-esay]
enabled  = true
filter   = rapports-esay
backend  = systemd
journalmatch = _SYSTEMD_UNIT=rapports-esay.service
maxretry = 10
findtime = 10m
bantime  = 1h
bantime.increment = true
port     = http,https
